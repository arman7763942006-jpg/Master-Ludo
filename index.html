<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Supreme</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0b132b; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; background: #0b132b; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; position: absolute; top: 0; left: 0; background: #0b132b; z-index: 10; padding: 15px; overflow-y: auto; }
        .screen.active { display: flex !important; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        .wallet-box { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 14px; color: #ffd700; font-weight: bold; border: none; cursor: pointer; }
        .banner { background: #3a86ff; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
        .tournament-card { background: #1f4068; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .tournament-info { display: flex; justify-content: space-between; font-size: 13px; color: #a0aec0; margin-bottom: 8px; }
        .match-row { display: flex; justify-content: space-between; align-items: center; }
        .prize-amount { font-size: 18px; font-weight: bold; color: #4ade80; }
        .entry-btn { background: #22c55e; color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .center-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; gap: 20px; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid #22c55e; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .game-header { display: flex; justify-content: space-between; align-items: center; background: #162447; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; }
        .pot-box { background: #1f4068; padding: 5px 15px; border-radius: 15px; color: #ffd700; font-weight: bold; font-size: 14px; border: 1px solid #ffd700; }
        .timer-box { font-family: monospace; font-size: 18px; color: #4ade80; font-weight: bold; background: #000; padding: 4px 10px; border-radius: 5px; }
        .board-area { width: 100%; aspect-ratio: 1; background: #1b2a4a; border-radius: 10px; display: flex; justify-content: center; align-items: center; border: 2px solid #3a86ff; text-align: center; padding: 20px; }
        .score-display-panel { display: flex; justify-content: space-around; width: 100%; margin: 10px 0; }
        .score-card { background: #1f4068; padding: 8px 15px; border-radius: 8px; text-align: center; width: 45%; border: 1px solid rgba(255,255,255,0.1); }
        .score-card h4 { font-size: 12px; color: #a0aec0; }
        .score-card .val { font-size: 20px; font-weight: bold; color: #fff; }
        .dice-section { display: flex; justify-content: space-between; align-items: center; background: #162447; padding: 12px; border-radius: 10px; margin-top: auto; }
        .dice-btn { background: #3a86ff; color: #fff; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-card { background: #1f4068; padding: 20px; border-radius: 15px; width: 100%; max-width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        .yellow-btn { background: #facc15; color: #000; border: none; padding: 12px 20px; border-radius: 20px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; font-size: 16px; }
        .whatsapp-fixed { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25d366; color: #fff; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 12px; font-size: 13px; }
        .deposit-input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #3a86ff; background: #0b132b; color: #fff; text-align: center; font-size: 16px; margin: 10px 0; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="lobbyScreen" class="screen active">
        <div class="header">
            <h3>Ludo Supreme (Armaan)</h3>
            <button class="wallet-box" onclick="openWallet()">₹<span id="walletBal">10.00</span></button>
        </div>
        <div class="banner">
            <p style="font-size: 14px; font-weight: bold;">रिफरल ऑफर: शेयर करें और तुरंत ₹2 पाएं!</p>
            <button onclick="shareApp()" style="margin-top:8px; background:#fff; color:#3a86ff; border:none; padding:5px 12px; border-radius:15px; font-weight:bold; cursor:pointer;">शेयर करें</button>
        </div>
        <h4 style="margin-bottom: 10px; font-size: 15px; color: #cbd5e1;">टूर्नामेंट्स (विड्रॉल लिमिट: ₹200)</h4>
        <div id="tournamentsList"></div>
    </div>

    <div id="countdownScreen" class="screen center-screen">
        <div style="font-size: 50px;">⏳</div>
        <h2 style="color: #4ade80;">खेल शुरू हो रहा है...</h2>
    </div>

    <div id="searchingScreen" class="screen center-screen">
        <h3>प्लेयर्स ढूँढ रहे हैं...</h3>
        <div class="spinner"></div>
        <div style="font-size: 20px; color: #ffd700; font-weight: bold; margin: 15px 0;">VS 🤖 ओपोनेंट</div>
    </div>

    <div id="boardScreen" class="screen">
        <div class="game-header">
            <div class="pot-box">🏆 पॉट: ₹<span id="activePot">2.00</span></div>
            <div class="timer-box" id="matchTimer">03:00</div>
        </div>
        <div class="score-display-panel">
            <div class="score-card">
                <h4>आप</h4>
                <div class="val" id="myScore">0</div>
            </div>
            <div class="score-card">
                <h4>Oponent</h4>
                <div class="val" id="opScore">0</div>
            </div>
        </div>
        <div class="board-area">
            <div>
                <p style="font-size: 13px; color: #94a3b8;">गोतियाँ स्टार पॉइंट पर हैं</p>
                <h3 style="color: #38bdf8; margin: 10px 0;">🎲 लाइव लूडो बोर्ड</h3>
                <p id="boardActionLog" style="font-size: 12px; color: #4ade80;"></p>
            </div>
        </div>
        <div class="dice-section">
            <button class="dice-btn" style="width:100%;" onclick="rollDice()">पासा फेंके</button>
        </div>
    </div>

    <div id="resultScreen" class="screen center-screen" style="background: radial-gradient(circle, #1e3a8a, #0b132b);">
        <div style="font-size: 40px;">👑</div>
        <h2 style="color: #ffd700; margin-bottom: 10px;">आप जीत गए</h2>
        <h3 id="wonAmountText" style="color: #4ade80; font-size: 24px; margin-bottom: 20px;">₹2.00</h3>
        <button class="yellow-btn" onclick="goToLobby()">लॉबी पे जायें</button>
    </div>

    <div id="walletModal" class="modal-overlay">
        <div class="modal-card">
            <h3>वॉलेट डिपाजिट</h3>
            <input type="number" id="customDepositInput" class="deposit-input" min="1" placeholder="राशि दर्ज करें" oninput="updateQRLink()">
            <div style="background: #fff; padding: 8px; border-radius: 10px; display: inline-block; margin: 5px 0;">
                <a id="upiLink" href="#" onclick="triggerUPIPayment(event)">
                    <img id="qrImage" src="" alt="QR Code" width="110" height="110">
                </a>
            </div>
            <button onclick="closeWallet()" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:15px; margin-top:8px; cursor:pointer;">बंद करें</button>
        </div>
    </div>
</div>

<script>
    let wallet = 10.00;
    let currentPrize = 2.00;
    let myScoreVal = 0;
    let opScoreVal = 0;

    const tournaments = [
        { entry: 1, prize: 2, label: '3 मिनट लूडो' },
        { entry: 2, prize: 4, label: '3 मिनट लूडो' },
        { entry: 5, prize: 10, label: '5 मिनट लूडो' },
        { entry: 10, prize: 20, label: '10 मिनट लूडो' },
        { entry: 20, prize: 40, label: '10 मिनट लूडो' },
        { entry: 35, prize: 70, label: '10 मिनट लूडो' },
        { entry: 100, prize: 200, label: '10 मिनट लूडो' }
    ];

    function initLobby() {
        const list = document.getElementById('tournamentsList');
        if(!list) return;
        list.innerHTML = '';
        tournaments.forEach(t => {
            list.innerHTML += `
                <div class="tournament-card">
                    <div class="tournament-info">
                        <span>2 खिलाड़ी • 1 विजेता</span>
                        <span style="color:#38bdf8;">⏱️ ${t.label}</span>
                    </div>
                    <div class="match-row">
                        <div class="prize-box">
                            विजेता राशि<br>
                            <span class="prize-amount">₹${t.prize.toFixed(2)}</span>
                        </div>
                        <button class="entry-btn" onclick="startMatch(${t.entry}, ${t.prize})">₹${t.entry}</button>
                    </div>
                </div>
            `;
        });
        document.getElementById('walletBal').innerText = wallet.toFixed(2);
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        let target = document.getElementById(screenId);
        if(target) target.classList.add('active');
    }

    function goToLobby() {
        switchScreen('lobbyScreen');
        initLobby();
    }

    function shareApp() {
        wallet += 2.00;
        document.getElementById('walletBal').innerText = wallet.toFixed(2);
        alert('शेयर सफल! आपके वॉलेट में ₹2 जोड़ दिए गए हैं।');
    }

    function openWallet() {
        document.getElementById('walletModal').style.display = 'flex';
        updateQRLink();
    }

    function closeWallet() {
        document.getElementById('walletModal').style.display = 'none';
    }

    function updateQRLink() {
        let amtField = document.getElementById('customDepositInput').value;
        let amt = (amtField && parseFloat(amtField) >= 1) ? parseFloat(amtField) : 1;
        let upiString = `upi://pay?pa=armaan@ybl&pn=Armaan&am=${amt}&cu=INR`;
        document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(upiString)}`;
    }

    function triggerUPIPayment(e) {
        e.preventDefault();
        let amtField = document.getElementById('customDepositInput').value;
        let amt = (amtField && parseFloat(amtField) >= 1) ? parseFloat(amtField) : 1;
        window.location.href = `upi://pay?pa=armaan@ybl&pn=Armaan&am=${amt}&cu=INR`;
    }

    function startMatch(entry, prize) {
        if(wallet < entry) {
            alert('वॉलेट में पर्याप्त बैलेंस नहीं है!');
            openWallet();
            return;
        }
        wallet -= entry;
        currentPrize = prize;
        document.getElementById('walletBal').innerText = wallet.toFixed(2);

        switchScreen('countdownScreen');
        setTimeout(() => {
            switchScreen('searchingScreen');
            setTimeout(() => {
                initBoard();
            }, 1500);
        }, 1200);
    }

    function initBoard() {
        switchScreen('boardScreen');
        document.getElementById('activePot').innerText = currentPrize.toFixed(2);
        myScoreVal = Math.floor(Math.random() * 30) + 10;
        opScoreVal = Math.floor(Math.random() * 20);
        document.getElementById('myScore').innerText = myScoreVal;
        document.getElementById('opScore').innerText = opScoreVal;
        document.getElementById('boardActionLog').innerText = 'गेम शुरू! पासा फेंके।';
    }

    function rollDice() {
        let diceVal = Math.floor(Math.random() * 6) + 1;
        myScoreVal += diceVal * 10;
        document.getElementById('myScore').innerText = myScoreVal;
        document.getElementById('boardActionLog').innerText = `पासा आया: ${diceVal}`;
        setTimeout(() => {
            wallet += currentPrize;
            document.getElementById('wonAmountText').innerText = `₹${currentPrize.toFixed(2)}`;
            document.getElementById('walletBal').innerText = wallet.toFixed(2);
            switchScreen('resultScreen');
        }, 1000);
    }

    window.onload = function() {
        switchScreen('lobbyScreen');
        initLobby();
    };
</script>
</body>
</html>
